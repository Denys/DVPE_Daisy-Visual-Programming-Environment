es/",part:4,tags:["glassmorphism","examples","inspiration"],type:"tool",desc:"Curated 37 backdrop-filter CodePen demos. Frosted glass modals, morphing cards, progressive blur, cosmic effects."},{id:81,title:"CSS backdrop-filter for frosted glass — modern.css",url:"https://modern-css.com/frosted-glass-effect-without-opacity-hacks/",part:4,tags:["glassmorphism","css","modern"],type:"tutorial",desc:"Clean approach to frosted glass without legacy hacks. Blur applies to everything rendered behind, not just static backgrounds."},{id:82,title:"CSS Backdrop-Filter Blur with Overflow Hidden Fix — 2026 Guide",url:"https://copyprogramming.com/howto/transitioning-backdrop-filter-blur-on-an-element-with-overflow-hidden-parent-is-not-working",part:4,tags:["glassmorphism","debugging","stacking-context"],type:"tutorial",desc:"Solves the #1 glassmorphism bug: blur disappears with overflow: hidden parent. Zero-pixel filter workaround, performance-safe animation patterns."}];

const PARTS = {
  1: { label: "Core Morphisms", color: "#00E5FF" },
  2: { label: "Emerging Trends", color: "#00FF88" },
  3: { label: "AI Workflow", color: "#FFA000" },
  4: { label: "Tools & Performance", color: "#B400FF" },
};
const TYPE_ICONS = { docs:"📘", tutorial:"🔧", article:"📝", tool:"⚡", github:"🔗" };
const TYPE_LABELS = { docs:"Documentation", tutorial:"Tutorial", article:"Article", tool:"Tool / Generator", github:"GitHub / Issue" };

// ============================================================
// STATE
// ============================================================
let state = { search: "", part: null, type: null, tags: [], expanded: null };

// ============================================================
// RENDER
// ============================================================
function getAllTags() {
  const s = new Set();
  SOURCES.forEach(src => src.tags.forEach(t => s.add(t)));
  return [...s].sort();
}

function getFiltered() {
  return SOURCES.filter(s => {
    if (state.part && s.part !== state.part) return false;
    if (state.type && s.type !== state.type) return false;
    if (state.tags.length > 0 && !state.tags.some(t => s.tags.includes(t))) return false;
    if (state.search) {
      const q = state.search.toLowerCase();
      return s.title.toLowerCase().includes(q) || s.desc.toLowerCase().includes(q) || s.tags.some(t => t.includes(q));
    }
    return true;
  });
}

function render() {
  const filtered = getFiltered();

  // Count
  document.getElementById('countDisplay').textContent = `${filtered.length} / ${SOURCES.length}`;

  // Part filters
  const partEl = document.getElementById('partFilters');
  let partHtml = '';
  for (const [k, p] of Object.entries(PARTS)) {
    const ki = parseInt(k);
    const active = state.part === ki;
    const count = SOURCES.filter(s => s.part === ki).length;
    const style = active
      ? `background:${p.color}15;border-color:${p.color}40;color:${p.color}`
      : '';
    partHtml += `<button class="btn${active ? '' : ''}" style="${style}" onclick="togglePart(${ki})">Part ${k}: ${p.label} <span style="margin-left:6px;opacity:0.5">${count}</span></button>`;
  }
  const hasFilters = state.search || state.part || state.type || state.tags.length;
  if (hasFilters) partHtml += `<button class="btn clear" onclick="clearAll()">✕ Clear all</button>`;
  partEl.innerHTML = partHtml;

  // Type filters
  const typeEl = document.getElementById('typeFilters');
  let typeHtml = '';
  for (const [k, label] of Object.entries(TYPE_LABELS)) {
    const active = state.type === k;
    typeHtml += `<button class="type-btn${active ? ' active' : ''}" onclick="toggleType('${k}')">${TYPE_ICONS[k]} ${label}</button>`;
  }
  typeEl.innerHTML = typeHtml;

  // Tag filters
  const tagEl = document.getElementById('tagFilters');
  let tagHtml = '';
  getAllTags().forEach(tag => {
    const active = state.tags.includes(tag);
    tagHtml += `<button class="tag-btn${active ? ' active' : ''}" onclick="toggleTag('${tag}')">${tag}</button>`;
  });
  tagEl.innerHTML = tagHtml;

  // Source list
  const listEl = document.getElementById('sourceList');
  const emptyEl = document.getElementById('emptyState');

  if (filtered.length === 0) {
    listEl.innerHTML = '';
    emptyEl.style.display = 'block';
    return;
  }
  emptyEl.style.display = 'none';

  let html = '';
  filtered.forEach(src => {
    const part = PARTS[src.part];
    const isExp = state.expanded === src.id;
    const pc30 = part.color + '30';
    const pc08 = part.color + '13';
    const pc10 = part.color + '18';
    const pc25 = part.color + '40';

    html += `<div class="source-card${isExp ? ' expanded' : ''}" style="--part-color-30:${pc30};--part-color-08:${pc08}" onclick="toggleExpand(${src.id})">
      <div class="card-top">
        <span class="card-icon">${TYPE_ICONS[src.type]}</span>
        <div class="card-body">
          <div class="card-title">${esc(src.title)}</div>
          <div class="card-meta">
            <span class="part-badge" style="background:${pc10};color:${part.color};border:1px solid ${part.color}20">Part ${src.part}</span>
            <span class="type-label">${TYPE_LABELS[src.type]}</span>
          </div>
        </div>
        <span class="card-arrow">▼</span>
      </div>
      <div class="card-expanded">
        <p class="card-desc">${esc(src.desc)}</p>
        <div class="card-tags">${src.tags.map(t =>
          `<span class="card-tag${state.tags.includes(t) ? ' active' : ''}" onclick="event.stopPropagation();toggleTag('${t}')">${t}</span>`
        ).join('')}</div>
        <a href="${src.url}" target="_blank" rel="noopener noreferrer" class="open-btn"
           onclick="event.stopPropagation()"
           style="background:${pc10};border:1px solid ${pc25};color:${part.color}">
          Open resource →
        </a>
      </div>
    </div>`;
  });
  listEl.innerHTML = html;
}

function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ============================================================
// INTERACTIONS
// ============================================================
function togglePart(p) { state.part = state.part === p ? null : p; render(); }
function toggleType(t) { state.type = state.type === t ? null : t; render(); }
function toggleTag(t) {
  const i = state.tags.indexOf(t);
  if (i >= 0) state.tags.splice(i, 1); else state.tags.push(t);
  render();
}
function toggleExpand(id) { state.expanded = state.expanded === id ? null : id; render(); }
function clearAll() { state = { search: "", part: null, type: null, tags: [], expanded: null }; document.getElementById('searchInput').value = ''; render(); }

document.getElementById('searchInput').addEventListener('input', (e) => {
  state.search = e.target.value;
  render();
});

// ============================================================
// INIT
// ============================================================
render();
</script>
</body>
</html>
