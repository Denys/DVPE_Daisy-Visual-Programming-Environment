<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DVPE Glassmorphism Playground</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg-base: #0a0e1a;
  --bg-lighter: #0f1923;
  --panel-bg: rgba(10, 14, 26, 0.88);
  --panel-border: rgba(255,255,255,0.08);
  --text-primary: rgba(255,255,255,0.92);
  --text-secondary: rgba(255,255,255,0.55);
  --text-label: rgba(255,255,255,0.70);
  --cyan: 0, 229, 255;
  --green: 0, 255, 136;
  --purple: 180, 0, 255;
  --orange: 255, 160, 0;
  --yellow: 255, 230, 0;
  --accent: rgba(0, 229, 255, 0.8);
}

html, body { height: 100%; overflow: hidden; }

body {
  font-family: 'Inter', sans-serif;
  background: var(--bg-base);
  color: var(--text-primary);
  display: flex;
  flex-direction: column;
}

/* ========== TOP NAV ========== */
.topnav {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 16px;
  background: rgba(10,14,26,0.92);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid rgba(255,255,255,0.06);
  z-index: 100;
  flex-shrink: 0;
}
.topnav h1 {
  font-family: 'JetBrains Mono', monospace;
  font-size: 14px;
  font-weight: 600;
  color: rgba(0,229,255,0.9);
  letter-spacing: 0.5px;
}
.topnav .sep { color: rgba(255,255,255,0.2); }
.topnav .subtitle { font-size: 12px; color: var(--text-secondary); }

.tab-bar {
  display: flex;
  gap: 2px;
  margin-left: auto;
}
.tab-btn {
  background: transparent;
  border: 1px solid transparent;
  color: var(--text-secondary);
  font-family: 'Inter', sans-serif;
  font-size: 12px;
  font-weight: 500;
  padding: 5px 14px;
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.2s;
}
.tab-btn:hover { color: var(--text-primary); background: rgba(255,255,255,0.04); }
.tab-btn.active {
  color: rgba(0,229,255,0.95);
  background: rgba(0,229,255,0.08);
  border-color: rgba(0,229,255,0.2);
}

/* ========== MAIN LAYOUT ========== */
.main-layout {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* ========== CONTROLS PANEL ========== */
.controls-panel {
  width: 320px;
  min-width: 320px;
  background: var(--panel-bg);
  backdrop-filter: blur(16px);
  border-right: 1px solid var(--panel-border);
  overflow-y: auto;
  flex-shrink: 0;
}
.controls-panel::-webkit-scrollbar { width: 4px; }
.controls-panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

.control-section {
  padding: 14px 16px;
  border-bottom: 1px solid rgba(255,255,255,0.04);
}
.control-section h3 {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: var(--text-secondary);
  margin-bottom: 12px;
}

.control-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
}
.control-row:last-child { margin-bottom: 0; }

.control-row label {
  font-size: 11px;
  color: var(--text-label);
  min-width: 100px;
  flex-shrink: 0;
  font-weight: 500;
}

.control-row input[type="range"] {
  flex: 1;
  -webkit-appearance: none;
  appearance: none;
  height: 4px;
  background: rgba(255,255,255,0.08);
  border-radius: 2px;
  outline: none;
}
.control-row input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: rgba(0,229,255,0.8);
  border: 2px solid rgba(0,229,255,0.3);
  cursor: pointer;
  box-shadow: 0 0 8px rgba(0,229,255,0.3);
}

.control-row .val {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: rgba(0,229,255,0.8);
  min-width: 42px;
  text-align: right;
}

.color-chips {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.color-chip {
  width: 28px;
  height: 28px;
  border-radius: 6px;
  border: 2px solid transparent;
  cursor: pointer;
  transition: all 0.2s;
  position: relative;
}
.color-chip:hover { transform: scale(1.15); }
.color-chip.active { border-color: white; box-shadow: 0 0 10px var(--chip-glow); }
.color-chip::after {
  content: attr(data-label);
  position: absolute;
  bottom: -16px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 8px;
  color: var(--text-secondary);
  white-space: nowrap;
  font-family: 'JetBrains Mono', monospace;
}

/* Category preset buttons */
.preset-row {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
  margin-bottom: 10px;
}
.preset-btn {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  padding: 4px 8px;
  border-radius: 4px;
  border: 1px solid rgba(255,255,255,0.1);
  background: rgba(255,255,255,0.03);
  color: var(--text-secondary);
  cursor: pointer;
  transition: all 0.2s;
}
.preset-btn:hover {
  border-color: rgba(0,229,255,0.3);
  color: var(--text-primary);
}

/* ========== CANVAS AREA ========== */
.canvas-area {
  flex: 1;
  position: relative;
  overflow: hidden;
}

.canvas-bg {
  position: absolute;
  inset: 0;
  z-index: 0;
}

.wire-layer {
  position: absolute;
  inset: 0;
  z-index: 10;
  pointer-events: none;
}

.blocks-layer {
  position: absolute;
  inset: 0;
  z-index: 20;
}

/* Module block */
.module-block {
  position: absolute;
  min-width: 180px;
  cursor: grab;
  transition: box-shadow 0.25s, border-color 0.25s;
  user-select: none;
}
.module-block:active { cursor: grabbing; }
.module-block .block-header {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 12px;
  border-bottom: 1px solid rgba(255,255,255,0.04);
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}
.module-block .block-header .icon {
  width: 16px;
  height: 16px;
  border-radius: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
}
.module-block .block-body {
  padding: 12px;
  display: flex;
  gap: 16px;
  justify-content: center;
}

/* Knob */
.knob-container { text-align: center; }
.knob {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, rgba(60,60,80,0.8), rgba(20,20,35,0.9));
  border: 1px solid rgba(255,255,255,0.1);
  box-shadow: 0 2px 6px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.08);
  position: relative;
  margin: 0 auto 4px;
}
.knob::after {
  content: '';
  position: absolute;
  width: 2px;
  height: 12px;
  background: rgba(255,255,255,0.7);
  border-radius: 1px;
  top: 4px;
  left: 50%;
  transform: translateX(-50%) rotate(var(--knob-angle, -120deg));
  transform-origin: bottom center;
}
.knob-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.knob-value {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--text-label);
}

/* Ports */
.port {
  position: absolute;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  border: 2px solid;
  top: 50%;
  transform: translateY(-50%);
}
.port.input { left: -5px; }
.port.output { right: -5px; }

/* ========== GUIDE PANEL ========== */
.guide-panel {
  width: 380px;
  min-width: 380px;
  background: var(--panel-bg);
  backdrop-filter: blur(16px);
  border-left: 1px solid var(--panel-border);
  overflow-y: auto;
  flex-shrink: 0;
}
.guide-panel::-webkit-scrollbar { width: 4px; }
.guide-panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

.guide-panel.hidden { display: none; }

.guide-content {
  padding: 20px 18px;
}
.guide-content h2 {
  font-family: 'JetBrains Mono', monospace;
  font-size: 14px;
  font-weight: 600;
  color: rgba(0,229,255,0.9);
  margin-bottom: 16px;
  padding-bottom: 8px;
  border-bottom: 1px solid rgba(0,229,255,0.15);
}
.guide-content h3 {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  font-weight: 600;
  color: var(--text-primary);
  margin: 18px 0 8px;
  text-transform: uppercase;
  letter-spacing: 0.8px;
}
.guide-content p {
  font-size: 12px;
  line-height: 1.7;
  color: var(--text-label);
  margin-bottom: 10px;
}
.guide-content code {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  background: rgba(0,229,255,0.06);
  color: rgba(0,229,255,0.85);
  padding: 1px 5px;
  border-radius: 3px;
  border: 1px solid rgba(0,229,255,0.1);
}
.guide-content .term-block {
  background: rgba(255,255,255,0.02);
  border: 1px solid rgba(255,255,255,0.05);
  border-radius: 8px;
  padding: 12px 14px;
  margin-bottom: 10px;
}
.guide-content .term-block .term-name {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  font-weight: 600;
  color: rgba(0,229,255,0.9);
  margin-bottom: 4px;
}
.guide-content .term-block .term-syntax {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: rgba(255,160,0,0.8);
  margin-bottom: 6px;
  padding: 4px 8px;
  background: rgba(255,160,0,0.04);
  border-radius: 4px;
  border: 1px solid rgba(255,160,0,0.08);
}
.guide-content .term-block .term-desc {
  font-size: 11.5px;
  line-height: 1.6;
  color: var(--text-label);
}
.guide-content .term-block .term-visual {
  margin-top: 8px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.guide-content .term-block .term-swatch {
  width: 50px;
  height: 24px;
  border-radius: 4px;
  border: 1px solid rgba(255,255,255,0.1);
  flex-shrink: 0;
}

/* CSS output panel */
.css-output {
  position: relative;
}
.css-output pre {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10.5px;
  line-height: 1.6;
  color: var(--text-label);
  background: rgba(0,0,0,0.25);
  border: 1px solid rgba(255,255,255,0.05);
  border-radius: 8px;
  padding: 14px;
  overflow-x: auto;
  white-space: pre;
  tab-size: 2;
}
.css-output pre .prop { color: rgba(0,229,255,0.8); }
.css-output pre .val { color: rgba(255,160,0,0.85); }
.css-output pre .comment { color: rgba(255,255,255,0.25); }
.copy-btn {
  position: absolute;
  top: 8px;
  right: 8px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  padding: 4px 10px;
  border-radius: 4px;
  border: 1px solid rgba(0,229,255,0.2);
  background: rgba(0,229,255,0.08);
  color: rgba(0,229,255,0.8);
  cursor: pointer;
  transition: all 0.2s;
}
.copy-btn:hover { background: rgba(0,229,255,0.15); }

/* ========== RESPONSIVE ========== */
@media (max-width: 1100px) {
  .guide-panel { display: none; }
}
@media (max-width: 800px) {
  .controls-panel { width: 260px; min-width: 260px; }
}
</style>
</head>
<body>

<nav class="topnav">
  <h1>DVPE</h1>
  <span class="sep">›</span>
  <span class="subtitle">Glassmorphism Playground</span>
  <div class="tab-bar">
    <button class="tab-btn active" data-tab="playground">Playground</button>
    <button class="tab-btn" data-tab="terminology">Terminology</button>
    <button class="tab-btn" data-tab="prompts">AI Prompts</button>
    <button class="tab-btn" data-tab="css">CSS Output</button>
  </div>
</nav>

<div class="main-layout">
  <!-- LEFT: Controls -->
  <aside class="controls-panel" id="controlsPanel">
    <!-- Populated by JS -->
  </aside>

  <!-- CENTER: Canvas preview -->
  <div class="canvas-area" id="canvasArea">
    <canvas class="canvas-bg" id="canvasBg"></canvas>
    <svg class="wire-layer" id="wireLayer"></svg>
    <div class="blocks-layer" id="blocksLayer"></div>
  </div>

  <!-- RIGHT: Guide / CSS Output -->
  <aside class="guide-panel" id="guidePanel">
    <!-- Populated by JS based on active tab -->
  </aside>
</div>

<script>
// ============================================================
// STATE
// ============================================================
const STATE = {
  // Block glass
  blockBgOpacity: 0.40,
  blockBlur: 8,
  blockBorderAlpha: 0.30,
  blockGlowAlpha: 0.12,
  blockGlowSpread: 20,
  blockShadowAlpha: 0.30,
  blockRimAlpha: 0.06,
  blockRadius: 12,

  // Chrome glass (sidebar/inspector)
  chromeBgOpacity: 0.80,
  chromeBlur: 16,

  // Background
  bgGridOpacity: 0.03,
  bgGridSize: 40,
  bgBaseColor: '#0a0e1a',

  // Wires
  wireWidth: 2,
  wireGlowBlur: 6,
  wireGlowAlpha: 0.50,

  // Active category
  activeCategory: 'source',

  // Category colors (r,g,b strings)
  categories: {
    source:   { rgb: '0,229,255',   hex: '#00E5FF', label: 'Source',   icon: '∿' },
    filter:   { rgb: '0,255,136',   hex: '#00FF88', label: 'Filter',   icon: '⩔' },
    effect:   { rgb: '180,0,255',   hex: '#B400FF', label: 'Effect',   icon: '◎' },
    envelope: { rgb: '255,160,0',   hex: '#FFA000', label: 'Envelope', icon: '⏣' },
    io:       { rgb: '255,230,0',   hex: '#FFE600', label: 'I/O',      icon: '⇌' },
  }
};

// Block positions
const BLOCKS = [
  { id: 'osc', cat: 'source', label: 'OSCILLATOR', x: 120, y: 80, knobs: [{l:'FREQ',v:'440Hz',a:-30},{l:'AMP',v:'0.80',a:45}] },
  { id: 'flt', cat: 'filter', label: 'MOOG FILTER', x: 400, y: 60, knobs: [{l:'CUTOFF',v:'1200Hz',a:60},{l:'RESO',v:'0.70',a:20}] },
  { id: 'env', cat: 'envelope', label: 'ADSR', x: 140, y: 280, knobs: [{l:'ATT',v:'0.01s',a:-90},{l:'DEC',v:'0.3s',a:-20},{l:'REL',v:'0.5s',a:30}] },
  { id: 'out', cat: 'io', label: 'OUTPUT', x: 640, y: 160, knobs: [{l:'GAIN',v:'1.00',a:0}] },
];

// Wire connections: [fromBlockId, toBlockId]
const WIRES = [
  ['osc', 'flt'],
  ['flt', 'out'],
  ['env', 'flt'],
];

// ============================================================
// CONTROLS PANEL BUILDER
// ============================================================
function buildControls() {
  const panel = document.getElementById('controlsPanel');
  panel.innerHTML = `
    <div class="control-section">
      <h3>Category Color</h3>
      <div class="color-chips" id="catChips"></div>
    </div>

    <div class="control-section">
      <h3>Block Glass</h3>
      ${slider('blockBgOpacity', 'BG Opacity', 0, 1, 0.01, v => v.toFixed(2))}
      ${slider('blockBlur', 'Blur', 0, 24, 1, v => v + 'px')}
      ${slider('blockBorderAlpha', 'Border Alpha', 0, 1, 0.01, null)}
      ${slider('blockGlowAlpha', 'Glow Alpha', 0, 0.5, 0.01, null)}
      ${slider('blockGlowSpread', 'Glow Spread', 0, 60, 1, v => v + 'px')}
      ${slider('blockShadowAlpha', 'Shadow Alpha', 0, 1, 0.01, null)}
      ${slider('blockRimAlpha', 'Rim Alpha', 0, 0.2, 0.005, null)}
      ${slider('blockRadius', 'Radius', 0, 30, 1, v => v + 'px')}
    </div>

    <div class="control-section">
      <h3>Connection Wires</h3>
      ${slider('wireWidth', 'Width', 1, 6, 0.5, v => v + 'px')}
      ${slider('wireGlowBlur', 'Glow Blur', 0, 20, 1, v => v + 'px')}
      ${slider('wireGlowAlpha', 'Glow Alpha', 0, 1, 0.05, null)}
    </div>

    <div class="control-section">
      <h3>Background</h3>
      ${slider('bgGridOpacity', 'Grid Opacity', 0, 0.1, 0.005, null)}
      ${slider('bgGridSize', 'Grid Size', 10, 80, 1, v => v + 'px')}
    </div>

    <div class="control-section">
      <h3>Chrome Panels</h3>
      ${slider('chromeBgOpacity', 'BG Opacity', 0.3, 1, 0.01, v => v.toFixed(2))}
      ${slider('chromeBlur', 'Blur', 0, 30, 1, v => v + 'px')}
    </div>

    <div class="control-section">
      <h3>Presets</h3>
      <div class="preset-row">
        <button class="preset-btn" onclick="applyPreset('wire-visible')">Wire-Visible Glass</button>
        <button class="preset-btn" onclick="applyPreset('heavy-glass')">Heavy Glass</button>
        <button class="preset-btn" onclick="applyPreset('liquid-glass')">Liquid Glass</button>
        <button class="preset-btn" onclick="applyPreset('neon-max')">Neon Maximum</button>
        <button class="preset-btn" onclick="applyPreset('subtle')">Subtle</button>
      </div>
    </div>
  `;

  // Build category chips
  const chips = document.getElementById('catChips');
  Object.entries(STATE.categories).forEach(([key, cat]) => {
    const chip = document.createElement('div');
    chip.className = 'color-chip' + (key === STATE.activeCategory ? ' active' : '');
    chip.style.background = cat.hex;
    chip.style.setProperty('--chip-glow', cat.hex + '80');
    chip.dataset.label = cat.label;
    chip.dataset.cat = key;
    chip.onclick = () => {
      STATE.activeCategory = key;
      document.querySelectorAll('.color-chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      render();
    };
    chips.appendChild(chip);
  });

  // Attach slider listeners
  panel.querySelectorAll('input[type="range"]').forEach(input => {
    input.addEventListener('input', (e) => {
      const key = e.target.dataset.key;
      STATE[key] = parseFloat(e.target.value);
      const fmt = e.target.dataset.fmt;
      const valEl = e.target.nextElementSibling;
      if (fmt === 'px') valEl.textContent = STATE[key] + 'px';
      else if (fmt === 'f2') valEl.textContent = STATE[key].toFixed(2);
      else valEl.textContent = STATE[key].toFixed(fmt === 'f3' ? 3 : 2);
      render();
    });
  });
}

function slider(key, label, min, max, step, fmtFn) {
  const val = STATE[key];
  let fmt = 'f2';
  let display = val.toFixed(2);
  if (fmtFn) {
    display = fmtFn(val);
    if (display.endsWith('px')) fmt = 'px';
    else fmt = 'f2';
  }
  return `<div class="control-row">
    <label>${label}</label>
    <input type="range" min="${min}" max="${max}" step="${step}" value="${val}" data-key="${key}" data-fmt="${fmt}">
    <span class="val">${display}</span>
  </div>`;
}

// ============================================================
// PRESETS
// ============================================================
function applyPreset(name) {
  const presets = {
    'wire-visible': { blockBgOpacity:0.35, blockBlur:6, blockBorderAlpha:0.30, blockGlowAlpha:0.12, blockGlowSpread:20, blockShadowAlpha:0.25, blockRimAlpha:0.06, blockRadius:12, wireGlowBlur:8, wireGlowAlpha:0.60 },
    'heavy-glass': { blockBgOpacity:0.75, blockBlur:16, blockBorderAlpha:0.15, blockGlowAlpha:0.05, blockGlowSpread:10, blockShadowAlpha:0.40, blockRimAlpha:0.08, blockRadius:14, wireGlowBlur:4, wireGlowAlpha:0.30 },
    'liquid-glass': { blockBgOpacity:0.25, blockBlur:12, blockBorderAlpha:0.20, blockGlowAlpha:0.08, blockGlowSpread:15, blockShadowAlpha:0.20, blockRimAlpha:0.10, blockRadius:16, wireGlowBlur:6, wireGlowAlpha:0.45 },
    'neon-max': { blockBgOpacity:0.30, blockBlur:6, blockBorderAlpha:0.55, blockGlowAlpha:0.30, blockGlowSpread:35, blockShadowAlpha:0.30, blockRimAlpha:0.04, blockRadius:10, wireGlowBlur:12, wireGlowAlpha:0.80 },
    'subtle': { blockBgOpacity:0.50, blockBlur:10, blockBorderAlpha:0.12, blockGlowAlpha:0.04, blockGlowSpread:8, blockShadowAlpha:0.35, blockRimAlpha:0.03, blockRadius:12, wireGlowBlur:3, wireGlowAlpha:0.25 },
  };
  const p = presets[name];
  if (!p) return;
  Object.assign(STATE, p);
  buildControls();
  render();
}

// ============================================================
// BACKGROUND RENDERER
// ============================================================
function renderBackground() {
  const canvas = document.getElementById('canvasBg');
  const area = document.getElementById('canvasArea');
  canvas.width = area.offsetWidth;
  canvas.height = area.offsetHeight;
  const ctx = canvas.getContext('2d');

  // Base gradient
  const grd = ctx.createRadialGradient(
    canvas.width * 0.4, canvas.height * 0.3, 0,
    canvas.width * 0.4, canvas.height * 0.3, canvas.width * 0.8
  );
  grd.addColorStop(0, '#0f1923');
  grd.addColorStop(1, STATE.bgBaseColor);
  ctx.fillStyle = grd;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Grid
  if (STATE.bgGridOpacity > 0.001) {
    ctx.strokeStyle = `rgba(0,229,255,${STATE.bgGridOpacity})`;
    ctx.lineWidth = 1;
    for (let x = 0; x < canvas.width; x += STATE.bgGridSize) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
    }
    for (let y = 0; y < canvas.height; y += STATE.bgGridSize) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
    }
  }
}

// ============================================================
// WIRE RENDERER
// ============================================================
function renderWires() {
  const svg = document.getElementById('wireLayer');
  const area = document.getElementById('canvasArea');
  svg.setAttribute('width', area.offsetWidth);
  svg.setAttribute('height', area.offsetHeight);

  let defs = `<defs>`;
  Object.entries(STATE.categories).forEach(([key, cat]) => {
    defs += `<filter id="glow-${key}" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="${STATE.wireGlowBlur}" result="b"/>
      <feFlood flood-color="rgba(${cat.rgb},${STATE.wireGlowAlpha})" result="c"/>
      <feComposite in="c" in2="b" operator="in" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>`;
  });
  defs += `</defs>`;

  let paths = '';
  WIRES.forEach(([fromId, toId]) => {
    const fromBlock = BLOCKS.find(b => b.id === fromId);
    const toBlock = BLOCKS.find(b => b.id === toId);
    if (!fromBlock || !toBlock) return;

    const fromX = fromBlock.x + 180; // right edge
    const fromY = fromBlock.y + 60;
    const toX = toBlock.x;
    const toY = toBlock.y + 60;
    const dx = Math.abs(toX - fromX) * 0.4;

    const cat = fromBlock.cat;
    const rgb = STATE.categories[cat].rgb;
    paths += `<path d="M${fromX},${fromY} C${fromX+dx},${fromY} ${toX-dx},${toY} ${toX},${toY}"
      fill="none" stroke="rgba(${rgb},0.8)" stroke-width="${STATE.wireWidth}"
      filter="url(#glow-${cat})" />`;
  });

  svg.innerHTML = defs + paths;
}

// ============================================================
// BLOCK RENDERER
// ============================================================
function renderBlocks() {
  const layer = document.getElementById('blocksLayer');
  layer.innerHTML = '';

  BLOCKS.forEach(block => {
    const cat = STATE.categories[block.cat];
    const el = document.createElement('div');
    el.className = 'module-block';
    el.style.left = block.x + 'px';
    el.style.top = block.y + 'px';
    el.style.background = `rgba(10,14,26,${STATE.blockBgOpacity})`;
    el.style.backdropFilter = `blur(${STATE.blockBlur}px)`;
    el.style.webkitBackdropFilter = `blur(${STATE.blockBlur}px)`;
    el.style.border = `1px solid rgba(${cat.rgb},${STATE.blockBorderAlpha})`;
    el.style.borderRadius = STATE.blockRadius + 'px';
    el.style.boxShadow = [
      `0 0 ${STATE.blockGlowSpread}px rgba(${cat.rgb},${STATE.blockGlowAlpha})`,
      `0 4px 16px rgba(0,0,0,${STATE.blockShadowAlpha})`,
      `inset 0 1px 0 rgba(255,255,255,${STATE.blockRimAlpha})`,
    ].join(', ');

    // Header
    const header = document.createElement('div');
    header.className = 'block-header';
    header.style.color = cat.hex;
    header.innerHTML = `<span class="icon" style="background:rgba(${cat.rgb},0.15);color:${cat.hex}">${cat.icon}</span> ${block.label}`;
    el.appendChild(header);

    // Body with knobs
    const body = document.createElement('div');
    body.className = 'block-body';
    block.knobs.forEach(k => {
      body.innerHTML += `<div class="knob-container">
        <div class="knob" style="--knob-angle:${k.a}deg"></div>
        <div class="knob-label">${k.l}</div>
        <div class="knob-value">${k.v}</div>
      </div>`;
    });
    el.appendChild(body);

    // Ports
    const portIn = document.createElement('div');
    portIn.className = 'port input';
    portIn.style.borderColor = cat.hex;
    portIn.style.background = `rgba(${cat.rgb},0.3)`;
    portIn.style.boxShadow = `0 0 6px rgba(${cat.rgb},0.3)`;
    el.appendChild(portIn);

    const portOut = document.createElement('div');
    portOut.className = 'port output';
    portOut.style.borderColor = cat.hex;
    portOut.style.background = `rgba(${cat.rgb},0.3)`;
    portOut.style.boxShadow = `0 0 6px rgba(${cat.rgb},0.3)`;
    el.appendChild(portOut);

    // Dragging
    let drag = false, offX, offY;
    el.addEventListener('mousedown', (e) => {
      drag = true;
      offX = e.clientX - block.x;
      offY = e.clientY - block.y;
      el.style.zIndex = 25;
    });
    window.addEventListener('mousemove', (e) => {
      if (!drag) return;
      block.x = e.clientX - offX;
      block.y = e.clientY - offY;
      el.style.left = block.x + 'px';
      el.style.top = block.y + 'px';
      renderWires();
    });
    window.addEventListener('mouseup', () => {
      if (drag) { drag = false; el.style.zIndex = 20; }
    });

    layer.appendChild(el);
  });
}

  <h2>Playground Guide</h2>
  <p>Drag the sliders on the left to tune glassmorphism parameters. The canvas updates in real-time. Drag blocks to see wire glow behavior.</p>

  <h3>What to look for</h3>
  <p><strong>Wire glow through blocks:</strong> The cyan/green/orange wire glow should be faintly visible through the glass block surfaces. If you can't see it, reduce BG Opacity and/or Blur.</p>
  <p><strong>Neon border:</strong> The colored border + outer glow shadow creates the "neon" edge. Increase Border Alpha and Glow Alpha to make it pop. Increase Glow Spread for wider halo.</p>
  <p><strong>Depth:</strong> The depth shadow (Shadow Alpha) makes blocks feel elevated above the background. The rim light (Rim Alpha) adds a subtle top edge highlight.</p>

  <h3>Quick workflow</h3>
  <p>1. Use <strong>Presets</strong> at the bottom of the controls to jump to a starting point</p>
  <p>2. Fine-tune with sliders until the look matches your vision</p>
  <p>3. Switch to <strong>CSS Output</strong> tab to get copy-paste code</p>
  <p>4. Switch to <strong>AI Prompts</strong> tab to get ready-made prompts with your exact values</p>
  <p>5. Switch to <strong>Terminology</strong> tab to understand what each parameter does</p>

  <h3>Category colors</h3>
  <p>Click the color chips at the top of controls to switch the active category. All blocks update to show the selected color. In your actual DVPE, each block uses its own category color.</p>

  <h3>The key insight</h3>
  <p>The <strong>wire-glow-through-block</strong> effect requires:<br>
  • Block BG opacity ≤ 0.45<br>
  • Block blur ≤ 10px<br>
  • Wire glow intensity ≥ 0.40<br><br>
  AI tools default to opacity 0.7+ and blur 16px+, which kills this effect. The exact values from this playground, exported as CSS or AI prompts, solve that.</p>
</div>`;
}

// ============================================================
// TAB SWITCHING
// ============================================================
let activeTab = 'playground';
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    activeTab = btn.dataset.tab;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    updateGuide();
  });
});

function updateGuide() {
  const panel = document.getElementById('guidePanel');
  panel.innerHTML = getGuideContent(activeTab);
}

// ============================================================
// COPY HELPER
// ============================================================
function copyText(id) {
  const el = document.getElementById(id);
  const text = el.textContent || el.innerText;
  navigator.clipboard.writeText(text).then(() => {
    const btn = el.parentElement.querySelector('.copy-btn');
    btn.textContent = 'Copied!';
    setTimeout(() => btn.textContent = 'Copy', 1500);
  });
}

// ============================================================
// RENDER ORCHESTRATOR
// ============================================================
function render() {
  renderBackground();
  renderWires();
  renderBlocks();
  updateGuide();

  // Update chrome panels to reflect slider values
  document.getElementById('controlsPanel').style.background = `rgba(10,14,26,${STATE.chromeBgOpacity})`;
  document.getElementById('controlsPanel').style.backdropFilter = `blur(${STATE.chromeBlur}px)`;
  document.getElementById('guidePanel').style.background = `rgba(10,14,26,${STATE.chromeBgOpacity})`;
  document.getElementById('guidePanel').style.backdropFilter = `blur(${STATE.chromeBlur}px)`;
}

// ============================================================
// INIT
// ============================================================
buildControls();
render();

// Resize handler
window.addEventListener('resize', () => {
  renderBackground();
  renderWires();
});
</script>
