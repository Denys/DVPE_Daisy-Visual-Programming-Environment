name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dvpe_CLD/package-lock.json

      - name: Install dependencies
        working-directory: dvpe_CLD
        run: npm ci

      - name: Run tests
        working-directory: dvpe_CLD
        run: npm test -- --run

      - name: Lint
        working-directory: dvpe_CLD
        run: npm run lint

      - name: Build
        working-directory: dvpe_CLD
        run: npm run build
